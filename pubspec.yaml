name: score_pertandingan
description: "Papan skor pertandingan untuk 2 pemain dengan skor maksimal yang bisa diatur sebelum permainan."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron.ttf
          weight: 400
        - asset: assets/fonts/Orbitron.ttf
          weight: 700
        - asset: assets/fonts/Orbitron.ttf
          weight: 900
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
          weight: 400
